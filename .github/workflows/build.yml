name: Build LiteIME (APK + EXE)

# 在云端编译两个产物：
#   - Android: app-debug.apk
#   - Windows: LiteIME.exe
# 触发方式：push 到 main/master，或在 Actions 页面手动 Run workflow。
# 下载产物：进入对应 workflow run -> Artifacts。

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiteIME-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13 (含 tcl/tk)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build single-file EXE
        run: >-
          python -m PyInstaller --noconfirm --onefile --noconsole
          --name LiteIME --add-data "data;data"
          --distpath dist --workpath build windows/main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LiteIME-EXE
          path: dist/LiteIME.exe
          if-no-files-found: error
          retention-days: 30
